<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf6e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ダイエット記録">
<title>ダイエット記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{--bg:#fbf6e8;--card:#fffdf6;--ink:#4a4640;--sub:#9a9385;--line:#efe7d2;--acc:#dc9b88;--acc2:#9bbba6;--accbg:#fbece3;--up:#d27b6c;--down:#5e9e87}
@media(prefers-color-scheme:dark){:root{--bg:#1f1d1b;--card:#2a2725;--ink:#ece7e1;--sub:#a29a90;--line:#3a3632;--acc:#e8a091;--acc2:#8fc0ac;--accbg:#3a2b27;--up:#e8897a;--down:#7cc3aa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic',system-ui,-apple-system,'Hiragino Maru Gothic ProN',sans-serif;font-size:16px;line-height:1.5}
#app{max-width:720px;margin:0 auto;padding:12px 14px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
h1{font-size:1.15rem;margin:0}
h2{font-size:.95rem;margin:0 0 8px}
h2 small{font-weight:400;color:var(--sub);margin-left:6px;font-size:.75rem}
.status{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:3px 10px;font:inherit;font-size:.72rem;cursor:pointer}
.status[data-s=ok]{color:var(--down)}
.status[data-s=busy]{color:#c9962b}
.status[data-s=err]{color:var(--up)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
details.card>summary{cursor:pointer;font-weight:700;font-size:.95rem;margin:-2px 0 6px}
input,textarea,select,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=password],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px}
textarea{resize:none;overflow:hidden;min-height:44px;line-height:1.6}
.fl{display:block;font-size:.8rem;color:var(--sub);margin:10px 0 4px}
.fl:first-of-type{margin-top:0}
.cnt{color:var(--acc);margin-left:6px}
.row{display:flex;align-items:center;gap:8px}
.row input{max-width:9em}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dmid{flex:1;text-align:center}
#dLabel{font-weight:700;margin-bottom:2px}
#dDate{text-align:center;max-width:12em}
.ic,.mini{border:1px solid var(--line);background:var(--card);border-radius:12px;height:42px;min-width:42px;cursor:pointer;font-size:1.3rem}
.mini{font-size:.8rem;padding:0 10px}
.stepper{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;cursor:pointer}
.stepper b{min-width:2.5em;text-align:center;font-size:1.2rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:4.5em;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 6px;cursor:pointer;font-size:.85rem}
.seg button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:700}
.saved{text-align:center;color:var(--sub);font-size:.75rem;height:1em;margin:0}
.addrow{display:grid;grid-template-columns:1fr 6.5em auto;gap:8px}
.pri{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700}
.pri.sec{background:var(--acc2)}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1;min-width:6.5em;background:var(--bg);border-radius:12px;padding:8px 10px}
.stat span{display:block;font-size:.7rem;color:var(--sub)}
.stat b{font-size:1.05rem}
.sub{color:var(--sub);font-size:.78rem;margin:6px 0 0}
.wrow{display:grid;grid-template-columns:5.8em 1fr 4.5em 2em;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.wrow input{padding:5px 8px}
.diff{font-size:.8rem;text-align:right;color:var(--sub)}
.diff.up{color:var(--up)}.diff.down{color:var(--down)}
.x{border:0;background:none;color:var(--sub);font-size:1.2rem;cursor:pointer}
.chartbox{position:relative;height:300px;margin:10px 0}
.chk{display:flex;align-items:center;gap:6px;font-size:.85rem;margin:6px 0 10px}
.hrow{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;cursor:pointer}
.hrow b{margin-right:8px}
.hrow span{color:var(--sub);font-size:.8rem}
.photos{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.th{width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.addph{height:72px;min-width:72px;padding:0 10px;border:1px dashed var(--line);background:var(--bg);border-radius:10px;color:var(--sub);font-size:.78rem;cursor:pointer}
.photos:has(.th) .addph{width:72px;padding:0 4px}
.pend{font-size:.75rem;color:var(--acc)}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:8px}
#lb .bar{display:flex;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:720px;margin:0 auto}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;color:var(--sub);font-size:.72rem;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:1.25rem;line-height:1.2}
nav button.on{color:var(--acc);font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
<header><h1>ダイエット記録</h1><button id="status" class="status" data-s="local">読み込み中…</button></header>

<!-- 日記 -->
<section class="view" id="v-diary">
  <div class="datebar">
    <button id="dPrev" class="ic" aria-label="前の日">‹</button>
    <div class="dmid"><div id="dLabel"></div><input type="date" id="dDate"></div>
    <button id="dNext" class="ic" aria-label="次の日">›</button>
    <button id="dToday" class="mini">今日</button>
  </div>

  <div class="card">
    <h2>食事<small>改行で1品ずつ</small></h2>
    <label class="fl">朝<span class="cnt" data-cnt="morning"></span></label>
    <textarea data-k="morning" rows="2" placeholder="例:&#10;ごはん&#10;味噌汁"></textarea>
    <div class="photos" data-ph="morning"></div>
    <label class="fl">昼<span class="cnt" data-cnt="lunch"></span></label>
    <textarea data-k="lunch" rows="2"></textarea>
    <div class="photos" data-ph="lunch"></div>
    <label class="fl">夜<span class="cnt" data-cnt="dinner"></span></label>
    <textarea data-k="dinner" rows="2"></textarea>
    <div class="photos" data-ph="dinner"></div>
    <label class="fl">間食<span class="cnt" data-cnt="snack"></span></label>
    <textarea data-k="snack" rows="2"></textarea>
    <div class="photos" data-ph="snack"></div>
  </div>

  <div class="card">
    <h2>体重</h2>
    <div class="row"><input type="number" id="dWeight" step="0.1" inputmode="decimal" placeholder="--.-"><span>kg</span></div>
  </div>

  <div class="card">
    <h2>排便</h2>
    <div class="stepper"><button id="bcMinus" aria-label="減らす">−</button><b><span id="bcVal">0</span> 回</b><button id="bcPlus" aria-label="増やす">＋</button></div>
    <select data-k="bowelNote">
      <option value="">状態(未選択)</option>
      <option>ふつう</option><option>かため</option><option>やわらかい</option><option>下痢</option>
    </select>
  </div>

  <div class="card">
    <h2>生理</h2>
    <div class="seg" id="periodSeg">
      <button data-p="">なし</button><button data-p="開始">開始</button><button data-p="出血中">出血中</button><button data-p="終了">終了</button>
    </div>
  </div>

  <div class="card">
    <h2>運動<small>改行で1種目ずつ</small></h2>
    <textarea data-k="exercise" rows="2" placeholder="例:&#10;ウォーキング&#10;スクワット 20回"></textarea>
    <div class="row" style="margin-top:8px"><input type="number" data-k="exerciseMin" inputmode="numeric" placeholder="合計"><span>分</span></div>
  </div>

  <div class="card">
    <h2>メモ</h2>
    <textarea data-k="memo" rows="3" placeholder="体調・気分・気づいたこと"></textarea>
  </div>
  <p class="saved" id="saved"></p>
</section>

<!-- 体重 -->
<section class="view" id="v-weight" hidden>
  <div class="card">
    <h2>体重を記録</h2>
    <div class="addrow">
      <input type="date" id="wDate">
      <input type="number" id="wVal" step="0.1" inputmode="decimal" placeholder="kg">
      <button class="pri" id="wAdd">記録</button>
    </div>
    <p class="sub">同じ日付は上書きされます</p>
  </div>
  <div class="card" id="wSummary"></div>
  <div id="wList"></div>
</section>

<!-- グラフ -->
<section class="view" id="v-chart" hidden>
  <div class="card">
    <div class="seg" id="rangeSeg">
      <button data-r="30">1ヶ月</button><button data-r="90">3ヶ月</button><button data-r="180">半年</button><button data-r="365">1年</button><button data-r="all">全期間</button>
    </div>
    <div class="chartbox"><canvas id="cv"></canvas></div>
    <p id="chartMsg" class="sub"></p>
    <label class="chk"><input type="checkbox" id="maChk"> 7日移動平均を表示</label>
    <div id="chartStats" class="stats"></div>
  </div>
</section>

<!-- 履歴 -->
<section class="view" id="v-history" hidden>
  <div id="hList"></div>
</section>

<!-- 設定 -->
<section class="view" id="v-settings" hidden>
  <div class="card">
    <h2>目標体重</h2>
    <div class="row"><input type="number" id="sGoal" step="0.1" inputmode="decimal" placeholder="未設定"><span>kg</span></div>
    <p class="sub">グラフと体重タブに反映されます(端末ごとの設定)</p>
  </div>
  <div class="card">
    <h2>スマホ・PCで同期</h2>
    <label class="fl">GASウェブアプリのURL</label>
    <input type="url" id="sUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <label class="fl">合言葉(Code.gsのKEYと同じもの)</label>
    <input type="password" id="sKey" autocomplete="off">
    <div style="margin-top:10px"><button class="pri sec" id="sSync">今すぐ同期</button></div>
    <p class="sub">未設定でも、この端末内に保存されて使えます。同期するには両方の端末で同じURLと合言葉を入力してください。</p>
  </div>
  <div class="card">
    <h2>バックアップ</h2>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn" id="bExport">書き出し(JSON)</button>
      <button class="btn" id="bImport">読み込み</button>
      <input type="file" id="bFile" accept="application/json,.json" hidden>
    </div>
  </div>
</section>
</div>

<input type="file" id="phFile" accept="image/*" multiple hidden>
<div id="lb" hidden>
  <img id="lbImg" alt="">
  <div class="bar"><button class="btn" id="lbDel">削除</button><button class="btn" id="lbClose">閉じる</button></div>
</div>

<nav><div class="in">
  <button data-t="diary" class="on"><i>📝</i>日記</button>
  <button data-t="weight"><i>⚖️</i>体重</button>
  <button data-t="chart"><i>📈</i>グラフ</button>
  <button data-t="history"><i>📅</i>履歴</button>
  <button data-t="settings"><i>⚙️</i>設定</button>
</div></nav>

<script>
'use strict';
/* ---------- 基本 ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const WD=['日','月','火','水','木','金','土'];
const label=s=>{const d=parseD(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const signed=n=>Math.abs(n)<0.05?'±0.0':(n>0?'+':'')+n.toFixed(1);
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);

const LS='diet-record-v1', LSS='diet-record-settings-v1';
const TEXT_KEYS=['morning','lunch','dinner','snack','bowelNote','period','exercise','memo','photos'];
const NUM_KEYS=['bowelCount','exerciseMin'];
function loadJSON(k,def){try{return Object.assign({},def,JSON.parse(localStorage.getItem(k)||'{}'))}catch(e){return def}}
let db=loadJSON(LS,{weights:{},diary:{}});
let cfg=loadJSON(LSS,{goal:'',url:'',key:''});
const persist=()=>localStorage.setItem(LS,JSON.stringify(db));
const saveCfg=()=>localStorage.setItem(LSS,JSON.stringify(cfg));

let current=today(), tab='diary';

/* ---------- データ操作 ---------- */
function setField(date,k,v){
  const r=db.diary[date]||(db.diary[date]={});
  r[k]=v; r.updatedAt=Date.now();
  changed();
}
function setWeight(date,val){
  const n=parseFloat(val);
  db.weights[date]={weight:isNaN(n)?'':Math.round(n*10)/10,updatedAt:Date.now()};
  changed();
}
function weightList(){
  return Object.entries(db.weights)
    .filter(([,v])=>v&&v.weight!==''&&v.weight!=null&&!isNaN(Number(v.weight)))
    .map(([d,v])=>({date:d,w:Number(v.weight)}))
    .sort((a,b)=>a.date<b.date?-1:1);
}
function hasContent(r){
  if(!r)return false;
  return TEXT_KEYS.some(k=>k!=='photos'&&String(r[k]||'').trim()!=='')||photoCount(r)>0||NUM_KEYS.some(k=>Number(r[k])>0);
}

/* ---------- 同期 ---------- */
let syncTimer=null, syncing=false, again=false;
function setStatus(s,t){const el=$('#status');el.dataset.s=s;el.textContent=t}
function changed(){
  persist();
  const sv=$('#saved'); if(sv){sv.textContent='保存しました';clearTimeout(changed.t);changed.t=setTimeout(()=>sv.textContent='',1200)}
  if(!cfg.url){setStatus('local','端末のみ保存');return}
  setStatus('busy','変更あり…');
  clearTimeout(syncTimer); syncTimer=setTimeout(sync,1500);
}
function mergeSet(local,remoteArr,out){
  const rmap={}; let ch=false;
  for(const r of remoteArr||[]) if(r&&r.date) rmap[r.date]=r;
  for(const [date,r] of Object.entries(rmap)){
    const l=local[date];
    if(!l||(l.updatedAt||0)<(Number(r.updatedAt)||0)){
      const o={}; for(const k in r){ if(k!=='date') o[k]=r[k]; }
      TEXT_KEYS.forEach(k=>{ if(k in o) o[k]=o[k]==null?'':String(o[k]); });
      o.updatedAt=Number(r.updatedAt)||0;
      local[date]=o; ch=true;
    }
  }
  for(const [date,l] of Object.entries(local)){
    const r=rmap[date];
    if(!r||(Number(r.updatedAt)||0)<(l.updatedAt||0)) out.push(Object.assign({date},l));
  }
  return ch;
}
async function sync(){
  if(!cfg.url){setStatus('local','端末のみ保存');return}
  if(syncing){again=true;return}
  syncing=true; setStatus('busy','同期中…');
  try{
    const u=new URL(cfg.url); u.searchParams.set('key',cfg.key||'');
    const res=await fetch(u.toString());
    const remote=await res.json();
    if(remote.error) throw new Error(remote.error);
    const push={key:cfg.key||'',weight:[],diary:[]};
    const c1=mergeSet(db.weights,remote.weight,push.weight);
    const c2=mergeSet(db.diary,remote.diary,push.diary);
    persist();
    if(push.weight.length||push.diary.length){
      const r2=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(push)});
      const j=await r2.json(); if(j.error) throw new Error(j.error);
    }
    const d=new Date();
    setStatus('ok',`同期済み ${pad(d.getHours())}:${pad(d.getMinutes())}`);
    if((c1||c2)&&!($('#v-diary').contains(document.activeElement)&&tab==='diary')) renderTab();
  }catch(e){
    console.error(e);
    setStatus('err','同期エラー(タップで再試行)');
  }finally{
    syncing=false;
    if(again){again=false;sync()}
  }
}
$('#status').onclick=sync;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg.url)sync()});
window.addEventListener('online',()=>{if(cfg.url)sync()});
setInterval(()=>{if(!document.hidden&&cfg.url)sync()},120000);

/* ---------- タブ ---------- */
function show(t){
  tab=t;
  $$('.view').forEach(v=>v.hidden=v.id!=='v-'+t);
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  renderTab(); window.scrollTo(0,0);
}
function renderTab(){({diary:renderDiary,weight:renderWeight,chart:renderChart,history:renderHistory,settings:renderSettings})[tab]()}
$$('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));

/* ---------- 日記 ---------- */
const autosize=el=>{el.style.height='auto';el.style.height=Math.max(44,el.scrollHeight+2)+'px'};
function updateCounts(){
  ['morning','lunch','dinner','snack'].forEach(k=>{
    const n=lines($(`[data-k="${k}"]`).value).length;
    $(`[data-cnt="${k}"]`).textContent=n?`${n}品`:'';
  });
}
function renderDiary(){
  const r=db.diary[current]||{};
  $('#dDate').value=current;
  $('#dLabel').textContent=label(current)+(current===today()?'  ・今日':'');
  $$('[data-k]').forEach(el=>{
    el.value=r[el.dataset.k]==null?'':r[el.dataset.k];
    if(el.tagName==='TEXTAREA')autosize(el);
  });
  $('#bcVal').textContent=Number(r.bowelCount)||0;
  $$('#periodSeg button').forEach(b=>b.classList.toggle('on',(r.period||'')===b.dataset.p));
  const w=db.weights[current];
  $('#dWeight').value=(w&&w.weight!==''&&w.weight!=null)?w.weight:'';
  updateCounts();
  renderPhotos();
}
function gotoDay(d){current=d;renderDiary();window.scrollTo(0,0)}
$('#dPrev').onclick=()=>gotoDay(addDays(current,-1));
$('#dNext').onclick=()=>gotoDay(addDays(current,1));
$('#dToday').onclick=()=>gotoDay(today());
$('#dDate').onchange=e=>{if(e.target.value)gotoDay(e.target.value)};
document.addEventListener('input',e=>{
  const el=e.target;
  if(tab!=='diary'||!el.dataset||!el.dataset.k)return;
  setField(current,el.dataset.k,el.value);
  if(el.tagName==='TEXTAREA'){autosize(el);updateCounts()}
});
$('#dWeight').onchange=e=>{setWeight(current,e.target.value)};
function bump(n){
  const v=Math.max(0,(Number((db.diary[current]||{}).bowelCount)||0)+n);
  setField(current,'bowelCount',v); $('#bcVal').textContent=v;
}
$('#bcMinus').onclick=()=>bump(-1);
$('#bcPlus').onclick=()=>bump(1);
$$('#periodSeg button').forEach(b=>b.onclick=()=>{
  setField(current,'period',b.dataset.p);
  $$('#periodSeg button').forEach(x=>x.classList.toggle('on',x===b));
});

/* ---------- 写真(Googleドライブ) ---------- */
const MEALS=['morning','lunch','dinner','snack'];
const pending={};
let phTarget=null, lbState=null;
const photoCache=new Map();

function getPhotos(r){try{const o=JSON.parse((r&&r.photos)||'{}');return o&&typeof o==='object'?o:{}}catch(e){return {}}}
function photoCount(r){const o=getPhotos(r);return MEALS.reduce((s,m)=>s+(Array.isArray(o[m])?o[m].length:0),0)}
function setPhotos(date,meal,ids){const o=getPhotos(db.diary[date]);o[meal]=ids;setField(date,'photos',JSON.stringify(o))}

function apiGet(params){
  const u=new URL(cfg.url);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  u.searchParams.set('key',cfg.key||'');
  return fetch(u.toString()).then(r=>r.json());
}
function apiPost(obj){
  obj.key=cfg.key||'';
  return fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)}).then(r=>r.json());
}
function resizeImage(file,max=1000){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*s), h=Math.round(img.height*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('画像の変換に失敗しました')),'image/jpeg',0.8);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('この画像は読み込めません'))};
    img.src=url;
  });
}
function blobToB64(blob){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(String(fr.result).split(',')[1]);
    fr.onerror=()=>rej(new Error('読み込みに失敗しました'));
    fr.readAsDataURL(blob);
  });
}
async function cachePut(id,blob){
  try{if('caches' in window){const c=await caches.open('diet-photos');await c.put('/p/'+id,new Response(blob))}}catch(e){}
}
function seedPhoto(id,blob){
  photoCache.set(id,Promise.resolve(URL.createObjectURL(blob)));
  cachePut(id,blob);
}
function photoURL(id){
  if(photoCache.has(id))return photoCache.get(id);
  const p=(async()=>{
    let blob=null;
    try{if('caches' in window){const c=await caches.open('diet-photos');const m=await c.match('/p/'+id);if(m)blob=await m.blob()}}catch(e){}
    if(!blob){
      if(!cfg.url)throw new Error('同期設定がありません');
      const j=await apiGet({action:'photo',id});
      if(j.error)throw new Error(j.error);
      const bin=atob(j.data), arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
      blob=new Blob([arr],{type:j.mime||'image/jpeg'});
      cachePut(id,blob);
    }
    return URL.createObjectURL(blob);
  })();
  photoCache.set(id,p);
  p.catch(()=>photoCache.delete(id));
  return p;
}
function renderPhotos(){
  const o=getPhotos(db.diary[current]);
  $$('[data-ph]').forEach(box=>{
    const meal=box.dataset.ph; box.innerHTML='';
    (Array.isArray(o[meal])?o[meal]:[]).forEach(id=>{
      const th=document.createElement('div');th.className='th';
      const img=document.createElement('img');img.alt='食事の写真';
      th.appendChild(img);
      photoURL(id).then(u=>{img.src=u}).catch(()=>{th.textContent='×';th.title='読み込めません'});
      th.onclick=()=>{if(img.src)openLb(meal,id,img.src)};
      box.appendChild(th);
    });
    if(pending[meal]){
      const p=document.createElement('span');p.className='pend';p.textContent=`アップロード中 ${pending[meal]}枚…`;box.appendChild(p);
    }
    const add=document.createElement('button');
    add.type='button';add.className='addph';add.textContent='📷 写真を追加';
    add.onclick=()=>{
      if(!cfg.url)return alert('写真の保存にはGoogleドライブとの同期設定が必要です(設定タブ)');
      phTarget={meal,date:current};$('#phFile').click();
    };
    box.appendChild(add);
  });
}
async function addPhotos(meal,date,files){
  for(const f of files){
    pending[meal]=(pending[meal]||0)+1;
    if(current===date&&tab==='diary')renderPhotos();
    try{
      const blob=await resizeImage(f);
      const b64=await blobToB64(blob);
      const j=await apiPost({action:'uploadPhoto',name:`${date}_${meal}_${Date.now()}.jpg`,data:b64});
      if(j.error)throw new Error(j.error);
      seedPhoto(j.id,blob);
      const ids=(getPhotos(db.diary[date])[meal]||[]).concat(j.id);
      setPhotos(date,meal,ids);
    }catch(e){
      alert('写真を保存できませんでした: '+e.message);
    }finally{
      pending[meal]--;
      if(current===date&&tab==='diary')renderPhotos();
    }
  }
}
$('#phFile').onchange=e=>{
  const files=[...e.target.files]; e.target.value='';
  if(files.length&&phTarget)addPhotos(phTarget.meal,phTarget.date,files);
};
function openLb(meal,id,src){lbState={meal,id};$('#lbImg').src=src;$('#lb').hidden=false}
function closeLb(){$('#lb').hidden=true;$('#lbImg').removeAttribute('src');lbState=null}
$('#lbClose').onclick=closeLb;
$('#lb').onclick=e=>{if(e.target.id==='lb')closeLb()};
$('#lbDel').onclick=()=>{
  if(!lbState||!confirm('この写真を削除しますか?(Googleドライブのゴミ箱に移ります)'))return;
  const {meal,id}=lbState;
  const ids=(getPhotos(db.diary[current])[meal]||[]).filter(x=>x!==id);
  setPhotos(current,meal,ids);
  apiPost({action:'deletePhoto',id}).catch(()=>{});
  photoCache.delete(id);
  closeLb(); renderPhotos();
};

/* ---------- 体重 ---------- */
const yearOpen={};
function renderWeight(){
  if(!$('#wDate').value)$('#wDate').value=today();
  const asc=weightList(), sm=$('#wSummary'), wrap=$('#wList');
  wrap.innerHTML='';
  if(!asc.length){sm.innerHTML='<p class="sub" style="margin:0">まだ記録がありません</p>';return}
  const last=asc[asc.length-1], first=asc[0], goal=parseFloat(cfg.goal);
  const mk=(t,v)=>`<div class="stat"><span>${t}</span><b>${v}</b></div>`;
  let h=mk('最新',last.w.toFixed(1)+' kg')+mk('開始比',signed(last.w-first.w)+' kg');
  if(goal) h+=mk('目標まで',last.w>goal?`あと ${(last.w-goal).toFixed(1)} kg`:'達成!');
  sm.innerHTML=`<div class="stats">${h}</div><p class="sub">${last.date.replace(/-/g,'/')} 時点</p>`;
  const rows=asc.map((p,i)=>({date:p.date,w:p.w,diff:i?p.w-asc[i-1].w:null})).reverse();
  const byYear=new Map();
  rows.forEach(r=>{const y=r.date.slice(0,4);if(!byYear.has(y))byYear.set(y,[]);byYear.get(y).push(r)});
  let firstYear=true;
  for(const [y,list] of byYear){
    const det=document.createElement('details');det.className='card';
    det.open=yearOpen[y]!==undefined?yearOpen[y]:firstYear; firstYear=false;
    det.addEventListener('toggle',()=>{yearOpen[y]=det.open});
    const sum=document.createElement('summary');sum.textContent=`${y}年(${list.length}件)`;
    det.appendChild(sum);
    list.forEach(r=>{
      const row=document.createElement('div');row.className='wrow';
      const d=document.createElement('span');d.textContent=label(r.date);
      const inp=document.createElement('input');inp.type='number';inp.step='0.1';inp.inputMode='decimal';inp.value=r.w;
      inp.onchange=()=>{if(inp.value!=='')setWeight(r.date,inp.value);renderWeight()};
      const df=document.createElement('span');df.className='diff '+(r.diff>0.04?'up':r.diff<-0.04?'down':'');
      df.textContent=r.diff==null?'':signed(r.diff);
      const del=document.createElement('button');del.className='x';del.textContent='×';del.setAttribute('aria-label','削除');
      del.onclick=()=>{if(confirm(`${label(r.date)} の体重を削除しますか?`)){setWeight(r.date,'');renderWeight()}};
      row.append(d,inp,df,del);det.appendChild(row);
    });
    wrap.appendChild(det);
  }
}
$('#wAdd').onclick=()=>{
  const d=$('#wDate').value, v=$('#wVal').value;
  if(!d||v===''||isNaN(parseFloat(v)))return alert('日付と体重を入力してください');
  setWeight(d,v); $('#wVal').value=''; renderWeight();
};

/* ---------- グラフ ---------- */
let chart=null, range='90';
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
$$('#rangeSeg button').forEach(b=>b.onclick=()=>{range=b.dataset.r;renderChart()});
$('#maChk').onchange=()=>renderChart();
function renderChart(){
  $$('#rangeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.r===range));
  const msg=$('#chartMsg'), stats=$('#chartStats');
  msg.textContent=''; stats.innerHTML='';
  if(chart){chart.destroy();chart=null}
  if(typeof Chart==='undefined'){msg.textContent='グラフの表示にはインターネット接続が必要です';return}
  const all=weightList();
  const pts=range==='all'?all:all.filter(p=>p.date>=addDays(today(),-Number(range)));
  if(!pts.length){msg.textContent='この期間の体重データがありません';return}
  const acc=cssVar('--acc'),acc2=cssVar('--acc2'),sub=cssVar('--sub'),line=cssVar('--line');
  const X=p=>parseD(p.date).getTime();
  const ds=[{label:'体重',data:pts.map(p=>({x:X(p),y:p.w})),borderColor:acc,backgroundColor:acc,tension:.25,borderWidth:2,pointRadius:pts.length>60?0:3,pointHoverRadius:5}];
  if($('#maChk').checked){
    const ma=pts.map(p=>{
      const from=addDays(p.date,-6);
      const w=all.filter(q=>q.date>=from&&q.date<=p.date);
      return {x:X(p),y:w.reduce((s,q)=>s+q.w,0)/w.length};
    });
    ds.push({label:'7日平均',data:ma,borderColor:acc2,backgroundColor:acc2,borderWidth:2,pointRadius:0,tension:.3});
  }
  const goal=parseFloat(cfg.goal);
  const x0=X(pts[0]), x1=X(pts[pts.length-1]);
  if(goal) ds.push({label:'目標',data:[{x:x0,y:goal},{x:x1,y:goal}],borderColor:sub,borderDash:[6,6],borderWidth:1.5,pointRadius:0});
  const longSpan=(x1-x0)/86400000>200;
  chart=new Chart($('#cv'),{
    type:'line',data:{datasets:ds},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'nearest',intersect:false},
      plugins:{
        legend:{display:ds.length>1,labels:{color:sub,boxWidth:12}},
        tooltip:{callbacks:{
          title:it=>{const d=new Date(it[0].parsed.x);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`},
          label:c=>`${c.dataset.label}: ${c.parsed.y.toFixed(1)} kg`
        }}
      },
      scales:{
        x:{type:'linear',min:x0===x1?x0-86400000*3:x0,max:x0===x1?x1+86400000*3:x1,
          ticks:{color:sub,maxTicksLimit:6,callback:v=>{const d=new Date(v);return longSpan?`${String(d.getFullYear()).slice(2)}/${d.getMonth()+1}/${d.getDate()}`:`${d.getMonth()+1}/${d.getDate()}`}},
          grid:{color:line}},
        y:{ticks:{color:sub,callback:v=>v.toFixed(1)},grid:{color:line}}
      }
    }
  });
  const ws=pts.map(p=>p.w), mk=(t,v)=>`<div class="stat"><span>${t}</span><b>${v}</b></div>`;
  stats.innerHTML=mk('期間の変化',signed(pts[pts.length-1].w-pts[0].w)+' kg')+mk('最高',Math.max(...ws).toFixed(1))+mk('最低',Math.min(...ws).toFixed(1));
}

/* ---------- 履歴 ---------- */
function renderHistory(){
  const wrap=$('#hList'); wrap.innerHTML='';
  const dates=new Set();
  Object.keys(db.diary).forEach(d=>{if(hasContent(db.diary[d]))dates.add(d)});
  weightList().forEach(p=>dates.add(p.date));
  const list=[...dates].sort().reverse();
  if(!list.length){wrap.innerHTML='<div class="card"><p class="sub" style="margin:0">まだ記録がありません</p></div>';return}
  const byMonth=new Map();
  list.forEach(d=>{const m=d.slice(0,7);if(!byMonth.has(m))byMonth.set(m,[]);byMonth.get(m).push(d)});
  let first=true;
  for(const [m,ds] of byMonth){
    const det=document.createElement('details');det.className='card';det.open=first;first=false;
    const sum=document.createElement('summary');sum.textContent=`${m.slice(0,4)}年${Number(m.slice(5))}月(${ds.length}日)`;
    det.appendChild(sum);
    ds.forEach(d=>{
      const r=db.diary[d]||{}, w=db.weights[d];
      const parts=[];
      const meals=['morning','lunch','dinner','snack'].reduce((s,k)=>s+lines(r[k]).length,0);
      if(meals)parts.push(`食事${meals}品`);
      if(Number(r.bowelCount)>0)parts.push(`排便${r.bowelCount}回`);
      if(r.period)parts.push(`生理:${r.period}`);
      if(Number(r.exerciseMin)>0)parts.push(`運動${r.exerciseMin}分`);
      else if(String(r.exercise||'').trim())parts.push('運動あり');
      if(photoCount(r))parts.push(`写真${photoCount(r)}枚`);
      if(String(r.memo||'').trim())parts.push('メモあり');
      const b=document.createElement('button');b.className='hrow';
      const t=document.createElement('b');t.textContent=label(d);
      const wt=(w&&w.weight!==''&&w.weight!=null)?`${Number(w.weight).toFixed(1)}kg  `:'';
      const s=document.createElement('span');s.textContent=wt+parts.join(' ・ ');
      b.append(t,s);
      b.onclick=()=>{current=d;show('diary')};
      det.appendChild(b);
    });
    wrap.appendChild(det);
  }
}

/* ---------- 設定 ---------- */
function renderSettings(){
  $('#sGoal').value=cfg.goal||'';
  $('#sUrl').value=cfg.url||'';
  $('#sKey').value=cfg.key||'';
}
$('#sGoal').onchange=e=>{cfg.goal=e.target.value;saveCfg()};
$('#sUrl').onchange=e=>{cfg.url=e.target.value.trim();saveCfg();if(cfg.url)sync();else setStatus('local','端末のみ保存')};
$('#sKey').onchange=e=>{cfg.key=e.target.value;saveCfg()};
$('#sSync').onclick=()=>{
  cfg.url=$('#sUrl').value.trim();cfg.key=$('#sKey').value;saveCfg();
  if(!cfg.url)return alert('URLを入力してください');
  sync();
};
$('#bExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`diet-record-${today()}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#bImport').onclick=()=>$('#bFile').click();
$('#bFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result); let n=0;
      for(const set of ['weights','diary']){
        for(const [d,v] of Object.entries(j[set]||{})){
          const o=Object.assign({},v); if(!o.updatedAt)o.updatedAt=Date.now();
          const l=db[set][d]; if(!l||(l.updatedAt||0)<o.updatedAt){db[set][d]=o;n++}
        }
      }
      changed(); renderTab(); alert(`${n}件を読み込みました`);
    }catch(err){alert('読み込めませんでした: '+err.message)}
    e.target.value='';
  };
  rd.readAsText(f);
};

/* ---------- 起動 ---------- */
show('diary');
if(cfg.url)sync();else setStatus('local','端末のみ保存');
</script>
